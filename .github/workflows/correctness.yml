name: Correctness
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v7
        with:
          path: luce-demos
      - name: Read compiler pins
        id: pins
        run: |
          echo "base=$(cat luce-demos/bootstrap/BASE)" >> "$GITHUB_OUTPUT"
          echo "luce=$(cat luce-demos/bootstrap/LUCE)" >> "$GITHUB_OUTPUT"
          echo "ui=$(cat luce-demos/bootstrap/UI)" >> "$GITHUB_OUTPUT"
          echo "three=$(cat luce-demos/bootstrap/THREE)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: dymokomi/luce-base
          ref: ${{ steps.pins.outputs.base }}
          path: luce-base
      - uses: actions/checkout@v7
        with:
          repository: dymokomi/luce
          ref: ${{ steps.pins.outputs.luce }}
          path: luce
      - uses: actions/checkout@v7
        with:
          repository: dymokomi/luce-ui
          ref: ${{ steps.pins.outputs.ui }}
          path: luce-ui
      - uses: actions/checkout@v7
        with:
          repository: dymokomi/luce-3d
          ref: ${{ steps.pins.outputs.three }}
          path: luce-3d
      - name: Select Clang
        run: |
          mkdir -p "$RUNNER_TEMP/luce-bin"
          ln -s "$(command -v clang)" "$RUNNER_TEMP/luce-bin/cc"
          echo "$RUNNER_TEMP/luce-bin" >> "$GITHUB_PATH"
      - name: Build native compilers
        run: |
          (cd luce-base && ./build.sh)
          (cd luce && LUCE_BASE_COMPILER=../luce-base/build/luce-base ./build.sh)
      - name: Portable ownership and interop tests
        working-directory: luce-demos
        run: ./test.sh
      - name: Metal demo smoke tests
        if: runner.os == 'macOS'
        working-directory: luce-demos
        run: ./test.sh --gui --opt 0
